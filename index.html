<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Odin Sign-up Form</title>
</head>
<body>
    <div id="left-part">
        <img id="cover-image" src="cover.jpg" alt="Cake Image">
        <div id="sidebar">
            <img id="sidebar-icon" src="image-sidebar.png">
            <div id="sidebar-title">ODIN</div>
        </div>
    </div>

    <div id="right-part">
        <div id="open-paragraph">
            <div id="paragraph-1">This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams. Sign up <i>now</i> to get started.</div>
            <div id="paragraph-2">You <i>know</i> you want to.</div>
        </div>

        <div id="sign-up-info">
            <div id="title">Let's do this!</div>

            <form id="sign-up-form" action="#" method="post">
                <div class="info-row">
                    <p>
                    <label for="first-name">FIRST NAME</label>
                        <input type="text" id="first-name" placeholder="John">
                    </p>

                    <p>
                        <label for="last-name">LAST NAME</label>
                        <input type="text" id="last-name" placeholder="Doe">
                    </p>
                </div>

                <div class="info-row">
                    <p>
                        <label for="email">EMAIL</label>
                        <input type="email" id="email" placeholder="abc@gmail.com">
                    </p>

                    <p>
                        <label for="phone-num">PHONE NUMBER</label>
                        <input type="number" id="phone-num" placeholder="098xxxxxxx">
                    </p>
                </div>

                <div class="info-row">
                    <p>
                        <label for="password">PASSWORD</label>
                        <input type="password" id="password" placeholder="Must contain numbers">
                    </p>

                    <p>
                        <label for="password-confirm">CONFIRM PASSWORD</label>
                        <input type="password" id="password-confirm" placeholder="Repeat your password">
                    </p>
                </div>

                <div id="finalize-section">
                    <button type="submit" id="submit-button">Create Account</button>
                    <div id="login-question">Already have an account? <a href="https://www.google.com/">Log in</a></div>
                </div>
            </form>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
